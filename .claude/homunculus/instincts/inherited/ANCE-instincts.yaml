# ANCE Workflow Nnue Training Feature Development

## Action

Follow the nnue-training-feature-development workflow:
1. Modify or add NNUE training and evaluation code (e.g., ance/eval/nnue/*.py, training/train.py)
2. Update or add dashboard and tooling scripts (e.g., ance/tools/gauntlet_dashboard.py, ance/tools/training_dashboard.py)
3. Update or add test files for new or changed features (e.g., tests/test_nnue_accumulator.py, tests/training/test_training_dashboard_smoke.py)
4. Update planning or documentation files to reflect new features or next steps (e.g., .planning/STATE.md, .planning/todos/pending/*.md)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: ance/eval/nnue/eval.py, ance/eval/nnue/features.py, ance/eval/nnue/inference.py

